apiVersion: v1
kind: ConfigMap
metadata:
  name: hrm-config
  namespace: hrm-system
  labels:
    app.kubernetes.io/name: atlas-hrm
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOST: "0.0.0.0"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "erp_db"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
