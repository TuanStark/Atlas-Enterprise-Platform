# ==============================================================================
# NGINX INGRESS CONTROLLER ROUTING RULES FOR ATLAS HRM PLATFORM
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hrm-ingress
  namespace: hrm-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  rules:
    - host: hrm.local
      http:
        paths:
          # 1. Routing API Request ➔ NestJS Backend Service
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 3000

          # 2. Routing UI Static Assets / SPA ➔ React Frontend Service
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 8080
