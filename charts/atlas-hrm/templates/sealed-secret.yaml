# ==============================================================================
# SECRETS MANAGEMENT (SealedSecret vs Plain K8s Secret)
# ==============================================================================

# [BẢN CHẤT - Quản lý Bí mật trên K8s]
# Kubernetes Secret mặc định KHÔNG hề mã hóa (Nó chỉ encode dạng base64, quăng lên mạng decode 1 giây là ra).
# 🚩 Lỗi Junior: Viết thẳng plaintext password vào file YAML Secret rồi Commit thẳng lên GitHub. Nếu source code bị lộ, hacker có ngay toàn bộ mật khẩu DB và JWT Secret.
# 🟩 Senior Review: Tuyệt đối cấm commit plaintext Secret. 
# Giải pháp Enterprise: Sử dụng Bitnami SealedSecrets. Dev sẽ dùng tool CLI `kubeseal` mã hóa password thành một chuỗi rác (EncryptedData). 
# Chuỗi này AN TOÀN tuyệt đối để đẩy lên Git công khai. Chỉ có con Controller chạy sâu dưới tầng đáy của K8s Cluster mới cầm chìa khóa Private Key để giải mã chuỗi rác đó ra thành K8s Secret thực sự cho App dùng.

{{- if .Values.secrets.useSealedSecrets }}
# ── Môi trường Production / Staging (BẮT BUỘC DÙNG SEALED SECRET) ──
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "atlas-hrm.fullname" . }}-secret
  namespace: {{ include "atlas-hrm.namespace" . }}
  labels:
    {{- include "atlas-hrm.labels" . | nindent 4 }}
spec:
  encryptedData:
    {{- toYaml .Values.secrets.sealedData | nindent 4 }}
{{- else }}
# ── Môi trường Local Dev (Chấp nhận dùng Plain Secret cho tiện phát triển) ──
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "atlas-hrm.fullname" . }}-secret
  namespace: {{ include "atlas-hrm.namespace" . }}
  labels:
    {{- include "atlas-hrm.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  JWT_EXPIRES_IN: {{ .Values.secrets.jwtExpiresIn | quote }}
{{- end }}
