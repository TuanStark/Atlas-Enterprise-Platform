{{/*
==============================================================================
SECRET MANAGEMENT STRATEGY:
- Dev environment: sử dụng K8s Secret thường (tiện cho dev nhanh)
- Staging/Prod: sử dụng SealedSecret (encrypted, safe to commit to Git)

Để tạo SealedSecret cho Staging/Prod:
  1. Tạo secret thường: kubectl create secret generic ... --dry-run=client -o yaml > secret.yaml
  2. Encrypt:          kubeseal --format yaml < secret.yaml > sealed-secret.yaml
  3. Copy encrypted values vào values-prod.yaml → secrets.sealedData
==============================================================================
*/}}

{{- if .Values.secrets.useSealedSecrets }}
# ── SealedSecret (Encrypted — an toàn commit vào Git) ──
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "atlas-hrm.fullname" . }}-secret
  namespace: {{ include "atlas-hrm.namespace" . }}
  labels:
    {{- include "atlas-hrm.labels" . | nindent 4 }}
spec:
  encryptedData:
    {{- toYaml .Values.secrets.sealedData | nindent 4 }}
  template:
    metadata:
      name: {{ include "atlas-hrm.fullname" . }}-secret
      namespace: {{ include "atlas-hrm.namespace" . }}
      labels:
        {{- include "atlas-hrm.labels" . | nindent 8 }}
    type: Opaque

{{- else }}
# ── Kubernetes Secret (Chỉ dùng cho Development — KHÔNG commit plaintext lên Git) ──
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "atlas-hrm.fullname" . }}-secret
  namespace: {{ include "atlas-hrm.namespace" . }}
  labels:
    {{- include "atlas-hrm.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  JWT_EXPIRES_IN: {{ .Values.secrets.jwtExpiresIn | quote }}
{{- end }}
