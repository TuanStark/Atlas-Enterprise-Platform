apiVersion: v1
kind: ConfigMap
metadata:
  name: hrm-config
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: atlas-hrm
    app.kubernetes.io/env: {{ .Values.global.environment }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  PORT: {{ .Values.config.port | quote }}
  HOST: {{ .Values.config.host | quote }}
  POSTGRES_HOST: {{ .Values.config.postgresHost | quote }}
  POSTGRES_PORT: {{ .Values.config.postgresPort | quote }}
  POSTGRES_DB: {{ .Values.config.postgresDb | quote }}
  REDIS_HOST: {{ .Values.config.redisHost | quote }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: hrm-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: atlas-hrm
    app.kubernetes.io/env: {{ .Values.global.environment }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  JWT_EXPIRES_IN: {{ .Values.secrets.jwtExpiresIn | quote }}
