# ==============================================================================
# POD DISRUPTION BUDGETS (PDB)
# ==============================================================================
{{- if .Values.pdb.backend.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "atlas-hrm.fullname" . }}-backend-pdb
  namespace: {{ include "atlas-hrm.namespace" . }}
  labels:
    {{- include "atlas-hrm.componentLabels" (dict "component" "backend" "root" .) | nindent 4 }}
spec:

  # ==========================================================================
  # [BẢN CHẤT - Bảo kê hệ thống khi Drain Node]
  # Tình huống: Đội hạ tầng (Ops) bảo trì K8s, gõ lệnh `kubectl drain node-1` để dọn sạch server vật lý số 1.
  # 🚩 Nếu không có PDB: Và nếu xui xẻo cả 2 Pod backend của bạn đều nằm trên Node-1 -> K8s sẽ tàn nhẫn XÓA CÙNG LÚC cả 2 Pod -> DOWNTIME toàn hệ thống!
  # 🟩 Senior Review: PDB chính là "Tờ lệnh bảo kê". 
  # `minAvailable: 1` nghĩa là ép K8s lúc nào cũng phải chừa lại ít nhất 1 Pod sống sót nhận traffic. 
  # Lúc K8s muốn Drain Node-1, nó chỉ dám xóa 1 Pod, phải đợi Pod mới tạo xong bên Node-2, chạy ngon lành mới dám quay lại xóa nốt Pod còn lại trên Node-1.
  # ==========================================================================
  
  {{- if .Values.pdb.backend.minAvailable }}
  minAvailable: {{ .Values.pdb.backend.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.pdb.backend.maxUnavailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "atlas-hrm.selectorLabels" (dict "component" "backend" "root" .) | nindent 6 }}
{{- end }}
---
{{- if .Values.pdb.frontend.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "atlas-hrm.fullname" . }}-frontend-pdb
  namespace: {{ include "atlas-hrm.namespace" . }}
  labels:
    {{- include "atlas-hrm.componentLabels" (dict "component" "frontend" "root" .) | nindent 4 }}
spec:
  {{- if .Values.pdb.frontend.minAvailable }}
  minAvailable: {{ .Values.pdb.frontend.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.pdb.frontend.maxUnavailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "atlas-hrm.selectorLabels" (dict "component" "frontend" "root" .) | nindent 6 }}
{{- end }}
