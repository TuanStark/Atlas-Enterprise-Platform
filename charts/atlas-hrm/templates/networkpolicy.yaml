# ==============================================================================
# NETWORK POLICIES — ENTERPRISE MICRO-SEGMENTATION
# ==============================================================================
{{- if .Values.networkPolicy.enabled }}

# ==========================================================================
# [BẢN CHẤT - Mô hình Zero-Trust]
# Kubernetes mặc định là "mạng phẳng" - Pod nào cũng có thể gọi Pod nào. 
# Nếu hacker chiếm được Frontend qua XSS, họ có thể ping thẳng vào cổng 5432 của DB (rất nguy hiểm).
# 🟩 Senior Review: Nguyên tắc số 1 luôn là Default Deny (Đóng cửa cài then TẤT CẢ). Sau đó mới "đục tường" mở từng lỗ nhỏ (Whitelist).
# ==========================================================================

# ── 1. Default Deny All Ingress ──
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "atlas-hrm.fullname" . }}-default-deny
  namespace: {{ include "atlas-hrm.namespace" . }}
  labels:
    {{- include "atlas-hrm.labels" . | nindent 4 }}
spec:
  podSelector: {} # Áp dụng cho TOÀN BỘ Pods trong Namespace này.
  policyTypes:
    - Ingress     # Block toàn bộ traffic ĐI VÀO (Vì không có rule cho phép nào ở dưới).
---
# ==========================================================================
# [BẢN CHẤT - Whitelist Backend]
# Backend chỉ được phép nhận traffic từ đúng 2 luồng hợp pháp.
# 1. Từ Nginx Ingress Controller (traffic từ Internet).
# 2. Từ Frontend Pod (traffic nội bộ).
# Ai khác gọi vào -> DROP.
# ==========================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "atlas-hrm.fullname" . }}-backend-policy
  namespace: {{ include "atlas-hrm.namespace" . }}
  labels:
    {{- include "atlas-hrm.componentLabels" (dict "component" "backend" "root" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "atlas-hrm.selectorLabels" (dict "component" "backend" "root" .) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Rule 1: Cho phép từ Nginx Ingress Controller (tìm theo Label của namespace)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.config.port }}
    # Rule 2: Cho phép từ Frontend nội bộ (bất kỳ pod nào trong cùng namespace)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.config.port }}
---
# ==========================================================================
# [BẢN CHẤT - Whitelist Database]
# Tuyệt đối CẤM Frontend đụng vào Database. Chỉ Backend và Migration Job được phép chạm vào port 5432.
# 🟩 Senior Review: Nếu hacker chiếm được Frontend Web, họ cũng chỉ kẹt ở đó, không thể sờ vào dữ liệu khách hàng.
# ==========================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "atlas-hrm.fullname" . }}-postgres-policy
  namespace: {{ include "atlas-hrm.namespace" . }}
  labels:
    {{- include "atlas-hrm.componentLabels" (dict "component" "postgres" "root" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "atlas-hrm.selectorLabels" (dict "component" "postgres" "root" .) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: migration
      ports:
        - protocol: TCP
          port: 5432
---
# ── Redis: Chỉ cho phép từ Backend ──
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "atlas-hrm.fullname" . }}-redis-policy
  namespace: {{ include "atlas-hrm.namespace" . }}
  labels:
    {{- include "atlas-hrm.componentLabels" (dict "component" "redis" "root" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "atlas-hrm.selectorLabels" (dict "component" "redis" "root" .) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 6379
---
# ── Frontend: Chỉ cho phép từ Ingress Controller ──
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "atlas-hrm.fullname" . }}-frontend-policy
  namespace: {{ include "atlas-hrm.namespace" . }}
  labels:
    {{- include "atlas-hrm.componentLabels" (dict "component" "frontend" "root" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "atlas-hrm.selectorLabels" (dict "component" "frontend" "root" .) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
