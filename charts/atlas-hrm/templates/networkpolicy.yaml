# ==============================================================================
# NETWORK POLICIES — CHUẨN BẢO MẬT ENTERPRISE (ZERO-TRUST TOÀN DIỆN)
# ==============================================================================
{{- if .Values.networkPolicy.enabled }}

# ==========================================================================
# BƯỚC 1: DEFAULT DENY ALL (KHÓA CHẶT INGRESS & EGRESS)
# Kỹ thuật: Thiết lập podSelector rỗng {} áp dụng cho toàn bộ Namespace.
# Bản chất: Chuyển K8s từ trạng thái "Flat Network" sang "Zero-Trust".
# Block toàn bộ chiều đi vào (Ingress) và chiều đi ra (Egress). 
# Pods bị cô lập hoàn toàn, buộc phải đục lỗ (Whitelist) tường minh ở các bước sau.
# ==========================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "atlas-hrm.fullname" . }}-default-deny
  namespace: {{ include "atlas-hrm.namespace" . }}
  labels:
    {{- include "atlas-hrm.labels" . | nindent 4 }}
spec:
  podSelector: {} # Chọn toàn bộ Pods trong Namespace
  policyTypes:
    - Ingress
    - Egress      # Chuẩn Enterprise: Khóa chặt chiều đi ra để chống Data Exfiltration

---
# ==========================================================================
# BƯỚC 2: WHITELIST DNS (MỞ KẾT NỐI COREDNS)
# Kỹ thuật: Cho phép Egress (UDP/TCP port 53) tới namespace kube-system.
# Bản chất: Do Egress đã bị khóa ở Bước 1, các Pod không thể phân giải tên miền 
# nội bộ (ví dụ: gọi "atlas-hrm-backend" sẽ bị Timeout). 
# Bước này là bắt buộc để khôi phục khả năng DNS Resolution của Cluster.
# ==========================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "atlas-hrm.fullname" . }}-dns-policy
  namespace: {{ include "atlas-hrm.namespace" . }}
  labels:
    {{- include "atlas-hrm.labels" . | nindent 4 }}
spec:
  podSelector: {} # Áp dụng cho mọi Pods
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system # Nơi CoreDNS đang chạy
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# ==========================================================================
# BƯỚC 3: WHITELIST FRONTEND (TẦNG PRESENTATION)
# Kỹ thuật: Ingress từ Ingress Controller port 8080. Egress bị cấm hoàn toàn.
# Bản chất: Frontend chỉ làm nhiệm vụ trả về file tĩnh (HTML/JS/CSS). 
# Khóa chặt Egress giúp ngăn chặn Hacker dùng Frontend làm bàn đạp (Lateral Movement)
# hoặc gọi ra Internet tải mã độc nếu bị khai thác RCE.
# ==========================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "atlas-hrm.fullname" . }}-frontend-policy
  namespace: {{ include "atlas-hrm.namespace" . }}
  labels:
    {{- include "atlas-hrm.componentLabels" (dict "component" "frontend" "root" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "atlas-hrm.selectorLabels" (dict "component" "frontend" "root" .) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- if .Values.networkPolicy.kubeletIpBlock }}
    # [Van an toàn]: Đục lỗ cho Kubelet Healthcheck (Liveness/Readiness probes)
    - from:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.kubeletIpBlock | quote }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace | quote }}
      ports:
        - protocol: TCP
          port: 8080

---
# ==========================================================================
# BƯỚC 4: WHITELIST BACKEND (TẦNG APPLICATION LOGIC)
# Kỹ thuật: Ingress từ Nginx và Frontend. Egress tới Postgres, Redis và tùy chọn Internet.
# Bản chất: Dựa theo kiến trúc 3 tầng, Backend là trung tâm xử lý nghiệp vụ:
# 1. Nhận request từ ngoài (Ingress Controller) và web (Frontend).
# 2. Chủ động gọi ra Database và Cache.
# Tuyệt đối không nhận traffic từ các Pod lạ để tránh truy cập API trái phép.
# ==========================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "atlas-hrm.fullname" . }}-backend-policy
  namespace: {{ include "atlas-hrm.namespace" . }}
  labels:
    {{- include "atlas-hrm.componentLabels" (dict "component" "backend" "root" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "atlas-hrm.selectorLabels" (dict "component" "backend" "root" .) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.kubeletIpBlock }}
    # [Van an toàn]: Kubelet Healthcheck
    - from:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.kubeletIpBlock | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.config.port }}
    {{- end }}
    # Nhận traffic từ Ingress Controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.config.port }}
    # Nhận traffic nội bộ từ Frontend
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
      ports:
        - protocol: TCP
          port: {{ .Values.config.port }}
  egress:
    # Cho phép gọi sang Postgres Database
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Cho phép gọi sang Redis Cache
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: redis
      ports:
        - protocol: TCP
          port: 6379
    {{- if .Values.networkPolicy.allowEgressToInternet }}
    # Mở lỗ gọi ra External APIs (Internet) nếu được cấu hình
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
    {{- end }}

---
# ==========================================================================
# BƯỚC 5: WHITELIST MIGRATION JOB
# Kỹ thuật: Khóa Ingress. Mở Egress tới Postgres.
# Bản chất: Job chỉ chạy 1 lần lúc deploy để cập nhật Schema DB.
# Nó không cần lắng nghe bất cứ ai (Cấm Ingress), chỉ cần gọi vào Database.
# ==========================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "atlas-hrm.fullname" . }}-migration-policy
  namespace: {{ include "atlas-hrm.namespace" . }}
  labels:
    {{- include "atlas-hrm.componentLabels" (dict "component" "migration" "root" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "atlas-hrm.selectorLabels" (dict "component" "migration" "root" .) | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432

---
# ==========================================================================
# BƯỚC 6: WHITELIST POSTGRES (TẦNG LƯU TRỮ LÕI)
# Kỹ thuật: Mở port 5432 Ingress cho Backend và Migration. Cấm toàn bộ Egress.
# Bản chất: Đảm bảo nguyên tắc Least Privilege (Quyền tối thiểu).
# Database là "Két sắt", tuyệt đối cấm Ingress/Frontend chọc thẳng vào.
# Đồng thời khóa chặt Egress để nếu Database bị hack (SQL Injection to OS Shell), 
# Hacker cũng không thể tuồn dữ liệu ra ngoài Internet.
# ==========================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "atlas-hrm.fullname" . }}-postgres-policy
  namespace: {{ include "atlas-hrm.namespace" . }}
  labels:
    {{- include "atlas-hrm.componentLabels" (dict "component" "postgres" "root" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "atlas-hrm.selectorLabels" (dict "component" "postgres" "root" .) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: migration
      ports:
        - protocol: TCP
          port: 5432

---
# ==========================================================================
# BƯỚC 7: WHITELIST REDIS (TẦNG CACHING)
# Kỹ thuật: Mở port 6379 Ingress cho Backend. Cấm toàn bộ Egress.
# Bản chất: Tương tự như Postgres, Redis chứa session data rất nhạy cảm.
# Chỉ cho phép Backend truy cập. Khóa Egress chống Data Exfiltration.
# ==========================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "atlas-hrm.fullname" . }}-redis-policy
  namespace: {{ include "atlas-hrm.namespace" . }}
  labels:
    {{- include "atlas-hrm.componentLabels" (dict "component" "redis" "root" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "atlas-hrm.selectorLabels" (dict "component" "redis" "root" .) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
