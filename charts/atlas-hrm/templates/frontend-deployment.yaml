# ==============================================================================
# REACT FRONTEND — DEPLOYMENT (Stateless Web Server)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atlas-hrm.fullname" . }}-frontend
  namespace: {{ include "atlas-hrm.namespace" . }}
  labels:
    {{- include "atlas-hrm.componentLabels" (dict "component" "frontend" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  
  # [BẢN CHẤT - Tương tự Backend nhưng nhẹ nhàng hơn]
  # Khác với Backend (NodeJS) mất thời gian khởi động lâu, Frontend (React) sau khi build xong chỉ là các file tĩnh (HTML/CSS/JS) được phục vụ bằng Nginx.
  # Nó khởi động cực nhanh (chưa tới 1s), nên quá trình RollingUpdate (Tạo mới thay cũ) diễn ra chớp nhoáng và mượt mà.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "atlas-hrm.selectorLabels" (dict "component" "frontend" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "atlas-hrm.componentLabels" (dict "component" "frontend" "root" .) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "atlas-hrm.serviceAccountName" . }}
      
      # [BẢN CHẤT - Security Context cho Frontend]
      # 🟩 Senior Review: Ngay cả khi Frontend chỉ phục vụ file tĩnh, ta vẫn phải chạy Nginx bằng quyền Non-Root (UID 101 cho Nginx non-root).
      # Tránh rủi ro Nginx bị dính lỗi Buffer Overflow dẫn đến việc hacker chiếm quyền Node từ Frontend.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "atlas-hrm.image" .Values.frontend.image }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "atlas-hrm.fullname" . }}-config
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          
          # Nginx phản hồi tức thì, không cần Startup Probe phức tạp.
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
      {{- with .Values.frontend.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
