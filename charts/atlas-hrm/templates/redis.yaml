# ==============================================================================
# REDIS (In-Memory Cache / Message Broker)
# ==============================================================================
{{- if .Values.redis.enabled }}

# [BẢN CHẤT - Redis Stateful vs Stateless]
# Khác với Postgres (RDBMS) BẮT BUỘC phải toàn vẹn dữ liệu, Redis thường dùng làm Cache (Tạm thời, Mất thì query DB tạo lại) hoặc Queue (Hàng đợi).
# 🟩 Senior Review: Tùy thuộc vào yêu cầu của ứng dụng:
# 1. Nếu chỉ làm Cache cho nhanh: Có thể tắt PVC đi để chạy Redis như một Pod Stateless hoàn toàn (Chạy cực nhanh, sập thì mất cache, app tự load lại từ DB).
# 2. Nếu làm Nơi lưu trữ Session Đăng nhập: BẮT BUỘC gắn PVC (ổ cứng cứng) và dùng strategy Recreate tương tự Postgres, nếu không khi Redis sập -> Toàn bộ khách hàng bị văng ra khỏi hệ thống.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atlas-hrm.fullname" . }}-redis
  namespace: {{ include "atlas-hrm.namespace" . }}
  labels:
    {{- include "atlas-hrm.componentLabels" (dict "component" "redis" "root" .) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate # Vẫn dùng Recreate vì ta đang cắm PVC (Sử dụng tính năng AOF/RDB persistence của Redis)
  selector:
    matchLabels:
      {{- include "atlas-hrm.selectorLabels" (dict "component" "redis" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "atlas-hrm.componentLabels" (dict "component" "redis" "root" .) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "atlas-hrm.serviceAccountName" . }}
      containers:
        - name: redis
          image: {{ include "atlas-hrm.image" .Values.redis.image }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          # 🚩 Lỗi Junior: Thường hay truyền `REDIS_PASSWORD` thông qua biến môi trường ENV. Việc này rất dễ bị lộ khi ai đó gõ lệnh `kubectl describe pod` hoặc xem Process Tree.
          # 🟩 Senior Review: Ở môi trường siêu khắt khe, password DB/Redis phải được mount thành 1 File vật lý, hoặc nhúng qua config file bảo mật. Ở đây tạm thời ta dùng môi trường nội bộ ClusterIP.
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: {{ include "atlas-hrm.fullname" . }}-redis-pvc
{{- end }}
---
{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "atlas-hrm.fullname" . }}-redis
  namespace: {{ include "atlas-hrm.namespace" . }}
  labels:
    {{- include "atlas-hrm.componentLabels" (dict "component" "redis" "root" .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "atlas-hrm.selectorLabels" (dict "component" "redis" "root" .) | nindent 4 }}
{{- end }}
